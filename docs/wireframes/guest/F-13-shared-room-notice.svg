<rect x="230" y="126" width="740" height="58" rx="4" fill="#fffbe6" stroke="#b45309" stroke-dasharray="6 4"/><text x="242" y="150" font-size="13" font-weight="normal" fill="#7a3d00" text-anchor="start">Room A-102 has 6 beds. Other guests may stay in the same room on your dates.</text><text x="242" y="170" font-size="13" font-weight="normal" fill="#7a3d00" text-anchor="start">Your belongings are your own responsibility. Lockers are at the reception.</text>
